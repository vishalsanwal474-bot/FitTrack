services:
  fittrack:
    build: .
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/workout-tracker
      JWT_SECRET: local_docker_dev_secret_change_me
      CLIENT_URL: http://localhost:5000
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - fittrack_mongo:/data/db

volumes:
  fittrack_mongo:
